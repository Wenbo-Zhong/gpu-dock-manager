name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test and package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 dbus-x11 desktop-file-utils libglib2.0-dev pkg-config gcc gettext
      - name: Unit, isolated D-Bus, static and sanitized C checks
        run: make check poc-check

  packages:
    needs: checks
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        format: [deb, rpm]
    steps:
      - uses: actions/checkout@v4
      - name: Install RPM tools
        if: matrix.format == 'rpm'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Build and inspect package
        run: |
          make ${{ matrix.format }}
          case "${{ matrix.format }}" in
            deb) dpkg-deb --info dist/*.deb ;;
            rpm) rpm -qip dist/*.rpm ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: usb4-gpu-manager-${{ matrix.format }}
          path: dist/*.${{ matrix.format }}
          if-no-files-found: error
